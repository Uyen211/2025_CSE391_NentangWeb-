<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Fill</title>
    <link rel="stylesheet" href="TH3-bai2.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<script src="http://ajax.aspnetcdn.com/ajax/jquery.validate/1.9/jquery.validate.min.js" type="text/javascript"></script>
	<script src="TH3-bai2.js"></script>
</head>
<body>
    <div class="container">
        <div id="message" class="message" style="display: none;">Bạn đã đăng ký thành công</div>
    
        <div id="formCon" class="form-container">
            <h2>Đăng Ký Tài Khoản</h2>
           
            <form action="#" id="formDK" class="form-input">
                <label for="name">Họ và Tên</label>
                <input type="text" id="name" name="name" placeholder="Nhập họ và tên" required>
              
                <label for="sdt">Số Điện Thoại</label>
                <input type="text" id="sdt" name="sdt" placeholder="Nhập số điện thoại" required>
              
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Nhập email" required>
         
                <label for="password">Mật Khẩu</label>
                <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
             
                <button id="dkButt" type="button" class="DKButton">Đăng Ký</button>
            </form>
          
        </div>
    </div>
    

</body>
</html>
