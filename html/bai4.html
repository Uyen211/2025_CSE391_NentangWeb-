<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css" />
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
  <!-- BASIC INFOINFO -->
  <form class="form-container">
    <h2>Basic Info</h2>

    <div class="form-row">
      <label for="employeeID">Employee ID</label>
      <input type="text" id="employeeID" value="9" disabled />
    </div>

    <div class="form-row">
      <label for="lastName">Last Name</label>
      <input type="text" id="lastName" value="Dodsworth" />
    </div>

    <div class="form-row">
      <label for="firstName">First Name</label>
      <input type="text" id="firstName" value="Anne" />
    </div>

    <div class="form-row">
      <label>Gender</label>
      <div class="radio-group">
        <label><input type="radio" name="gender" /> Male</label>
        <label><input type="radio" name="gender" /> Female</label>
        <label><input type="radio" name="gender" /> XXX</label>
        <label><input type="radio" name="gender" checked /> ZZZ</label>
      </div>
    </div>

    <div class="form-row">
      <label for="title">Title</label>
      <input type="text" id="title" value="Sales Representative" />
    </div>

    <div class="form-row">
      <label for="suffix">Suffix</label>
      <input type="text" id="suffix" value="Ms." />
    </div>

    <div class="form-row">
      <label for="birthDate">BirthDate</label>
      <input type="datetime-local" id="birthDate" value="1969-07-02 00:00:00" />
    </div>

    <div class="form-row">
      <label for="hireDate">HireDate</label>
      <input type="datetime-local" id="hireDate" value="1994-11-15 00:00:00" />
    </div>

    <div class="form-row">
      <label for="ssn">SSN # (if applicable)</label>
      <input type="text" id="ssn" />
    </div>

    <div class="form-row">
      <label for="reportsTo">Reports To</label>
      <select id="reportsTo">
        <option>Buchanan</option>
      </select>
    </div>
  </form>
  
  <!-- CONTACT INFO -->
  <form class="form-container">
    <h2>Contact Info</h2>

    <div class="form-row">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder = "name@example.com" />
    </div>

    <div class="form-row">
      <label for="address">Address</label>
      <input type="text" id="address" value="7 Houndstooth Rd." />
    </div>

    <div class="form-row">
      <label for="city">City</label>
      <input type="text" id="city" value="London" />
    </div>

    <div class="form-row">
      <label for="region">Region</label>
      <input type="text" id="region" />
    </div>

    <div class="form-row">
      <label for="postalcode">Postal Code</label>
      <input type="text" id="postalcode" value="WG2 7LT" />
    </div>

    <div class="form-row">
      <label for="Country">Country</label>
      <select id="Country">
        <option>Russian Federation</option>
        <option>VietNam</option>
      </select>
    </div>

    <div class="form-row">
      <label for="ushomephone">US Home Phone</label>
      <input type="text" id="ushomephone" value="(234)234-2342" />
    </div>

    <div class="form-row">
      <label for="photo">Photo</label>
      <input type="file" id="photo" />
    </div>

  </form>

  <form class="form-container">
    <h2>Optional Info</h2>

    <div class="form-row">
      <label for="notes">Notes</label>
      <div class="rich-text-editor">
        <textarea id="notes" name="notes">Anne has a BA degree in English from St. Lawrence College.
          She is fluent in French and German.ZZZ</textarea>
      </div>
    </div>

    <div class="form-row">
      <label>Preferred Shift</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="ps" /> Regular</label>
        <label><input type="checkbox" name="ps" /> Gravy Yard</label>
      </div>
    </div>

    <div class="form-row">
      <label>Active</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="Active" /> </label>
      </div>
    </div>

    <div class="form-row">
      <label for="captcha">Are you human?</label>
      <div class ="human">
        <div class="captcha-image" style="color: gray;">TIDAWO</div>
        <div class="captcha-change">Click to change</div>
        <input type="text" id="captcha" name="captcha" />
      </div>
    </div>

    <div class="form-actions">
      <button type="submit">Submit</button>
      <button type="button">Cancel</button>
    </div>
  </form>


</body>
</html>
