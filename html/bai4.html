<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css" />
    <title>Document</title>
</head>
<body>
  <form class="form-container">
    <h2>Basic Info</h2>

    <div class="form-row">
      <label for="employeeID">Employee ID</label>
      <input type="text" id="employeeID" value="9" disabled />
    </div>

    <div class="form-row">
      <label for="lastName">Last Name</label>
      <input type="text" id="lastName" value="Dodsworth" />
    </div>

    <div class="form-row">
      <label for="firstName">First Name</label>
      <input type="text" id="firstName" value="Anne" />
    </div>

    <div class="form-row">
      <label>Gender</label>
      <div class="radio-group">
        <label><input type="radio" name="gender" /> Male</label>
        <label><input type="radio" name="gender" /> Female</label>
        <label><input type="radio" name="gender" /> XXX</label>
        <label><input type="radio" name="gender" checked /> ZZZ</label>
      </div>
    </div>

    <div class="form-row">
      <label for="title">Title</label>
      <input type="text" id="title" value="Sales Representative" />
    </div>

    <div class="form-row">
      <label for="suffix">Suffix</label>
      <input type="text" id="suffix" value="Ms." />
    </div>

    <div class="form-row">
      <label for="birthDate">BirthDate</label>
      <input type="text" id="birthDate" value="1969-07-02 00:00:00" />
    </div>

    <div class="form-row">
      <label for="hireDate">HireDate</label>
      <input type="text" id="hireDate" value="1994-11-15 00:00:00" />
    </div>

    <div class="form-row">
      <label for="ssn">SSN # (if applicable)</label>
      <input type="text" id="ssn" />
    </div>

    <div class="form-row">
      <label for="reportsTo">Reports To</label>
      <select id="reportsTo">
        <option>Buchanan</option>
      </select>
    </div>
  </form>
      



</body>
</html>
