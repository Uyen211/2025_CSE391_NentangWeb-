<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/TH2-bai1.css" />
    <title>Contact Infor</title>
    

</head>
<body>

    <h2>Get in touch with us by filling contact form below</h2>


    <form class="form-container">
        <div class="item nameEmail">
            <input type="text" id="email"  placeholder="* Enter your full name"/>
            <input type="email" id="email"  placeholder="* Enter your email address"/>            
        </div>

        <div class="item">
            <input type="text" id="subject" placeholder="Enter your subject" />
        </div>

        <div class="item rich-text-editor" >
            <textarea style="color: gray;">* Your message here...</textarea>
        </div>

        <div class="form-actions">
            <button type="submit">Send message</button>
            <p style="color: gray;">* Please fill all required form field, thanks!</p>
        </div>
    </form>

</body>
</html>
