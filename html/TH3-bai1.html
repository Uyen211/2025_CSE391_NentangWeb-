<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/TH3-bai1.css">

    <title>To Do List</title>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    
    <div class="header p-5 text-center">
        <div class="hihi">
            <h1>TO DO LIST</h1>
            <form id="form-input" class="d-flex justify-content-center gap-2 mt-3">
                <input type="text" class="form-control" placeholder="Tên nhiệm vụ" id="taskName" />
                <button type="button" class="btn" id="addButton" onclick="addTask()" style="font-weight: bold;">Thêm</button>
            </form>
            
        </div>
    </div>

    <div class="body">
        <div id="taskList">
            <div class="task">
                <p class="task-number">Task 1</p>
                <div class="content">
                    <input type="checkbox" class="checkbox" data-id="1" onclick="check(event)"/>
                    <div class="card">
                        <div class="card-body">                            
                            <h4>Mua thú cưng</h4>
                        </div>
                    </div>
                    <button type="button" class="btn delete" onclick="deleteTask(event)">Xóa</button>
                    <button type="button" class="btn edit" onclick="editTask(event)">Sửa</button>
                </div>   
            </div>

            <div class="task">
                <p class="task-number">Task 2</p>
                <div class="content">
                    <input type="checkbox" class="checkbox" data-id="2" onclick="check(event)"/>
                    <div class="card">
                        <div class="card-body">
                            <h4>Học lập trình</h4>
                        </div>
                    </div>
                    <button type="button" class="btn delete" onclick="deleteTask(event)">Xóa</button>
                    <button type="button" class="btn edit" onclick="editTask(event)">Sửa</button>
                </div>
            </div>

            <div class="task">
                <p class="task-number">Task 3</p>
                <div class="content">
                    <input type="checkbox" class="checkbox" data-id="3" onclick="check(event)"/>
                    <div class="card">
                        <div class="card-body">
                            <h4>Tập thể dục</h4>
                        </div>
                    </div>
                    <button type="button" class="btn delete" onclick="deleteTask(event)">Xóa</button>
                    <button type="button" class="btn edit" onclick="editTask(event)">Sửa</button>
                </div>
            </div>
        </div>
    </div> 

    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Sửa Task</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <label>Tên nhiệm vụ <input type="text" class="form-control" id="editInput" /></label>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" onclick="confirmEdit()">Save changes</button>
            </div>
            </div>
        </div>
    </div>

    <script src="/js/TH3-bai1.js"></script>
</body>
</html>
